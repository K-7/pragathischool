<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#FFFDF8" />
    <!-- Gates the scroll-reveal animation on JS being available. Without this
         class, .reveal sections stay fully visible — so a JS failure degrades
         to a static page rather than a blank one. -->
    <script>
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body class="bg-ivory">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
